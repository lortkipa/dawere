# Postgres for local development. The host already runs a native Postgres on
# 5432, so this one is published on 5433 to stay out of its way.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dawere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dawere
      POSTGRES_PASSWORD: dawere
      POSTGRES_DB: dawere
    ports:
      - "5433:5432"
    volumes:
      - dawere-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dawere -d dawere"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dawere-db-data:
